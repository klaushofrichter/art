name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # `:main` and nothing else. A push to main is not a release, and
          # two workflows writing the same tag is a race: deploy-production
          # publishes `:<sha>`, which is what kube-setup's manifest pins, and
          # only that build carries APP_VERSION. A main build landing on the
          # same sha would replace the released image under the pin, and the
          # next pod restart would quietly run an unversioned build. `:latest`
          # is written by the deploy too, so it means the live release rather
          # than the newest commit on main.
          tags: |
            ghcr.io/klaushofrichter/art:main
