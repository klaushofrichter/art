name: PR checks

# Both branches, not just production. PRs to main — Dependabot's, in particular
# — previously ran nothing at all: build-push.yml triggers on push, and this
# file only listened for production. Dependency bumps were landing on main
# unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      - run: npm test

      # In the `test` job on purpose: `test` is a required status check on
      # production, so a vulnerable dependency blocks the merge. As its own
      # job it would be advisory and gate nothing.
      - run: npm audit --audit-level=high

      # Only on the way to production, because that is the merge that cuts a
      # release and so the moment the notes are read. Five releases running,
      # [Unreleased] was left holding the previous one's notes and published
      # them a second time; it is written down in two places and was missed
      # every time, which is the argument for checking it rather than asking.
      - name: Refuse notes that have already been published
        if: github.base_ref == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-changelog.sh

  e2e:
    # The Playwright suite runs here, on GitHub's runners, rather than in the
    # deploy: installing a browser on the in-cluster self-hosted runner
    # OOM-kills it. Against a locally started server, so a broken build is
    # caught before it is merged rather than after it is live.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci

      # `--with-deps` runs `apt-get update`, which reads every source on the
      # runner image — including Google's Chrome repository, which the image
      # ships and this job has no use for. We want Ubuntu's shared libraries
      # and nothing from Google. But one bad index fails the whole update and
      # takes the job with it: on 2026-09-09 a Hash Sum mismatch on
      # dl.google.com failed every e2e run for hours, and since e2e is a
      # required check on production, it blocked releases as well as PRs.
      # Nothing we depend on should be able to do that, so drop the source.
      - name: Install Chromium for Playwright
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - run: npm run build

      - name: Start the server and run the smoke test
        env:
          ASSETS_DIR: ${{ github.workspace }}/test/fixtures/assets
        run: |
          set -euo pipefail
          npm start &
          echo $! > /tmp/server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for server (${i}/20)"; sleep 2
          done
          curl -sf http://localhost:8080/health >/dev/null \
            || { echo "::error::server did not come up"; exit 1; }
          npm run test:e2e
          kill "$(cat /tmp/server.pid)" || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=0
          for f in sarif-results/*.sarif; do
            count=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + count))
            # Print what was found, not just how much. A bare count means
            # anyone hitting this gate has to re-run CodeQL locally to learn
            # anything, which is most of the cost of the gate.
            jq -r '.runs[] as $run | $run.results[]
              | . as $r
              | ($run.tool.driver.rules[$r.rule.index // 0].id // $r.ruleId) as $rule
              | ($r.locations[0].physicalLocation) as $loc
              | "\($loc.artifactLocation.uri):\($loc.region.startLine // 0)  [\($rule)]  \($r.message.text)"' "$f" || true
          done
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge"
            exit 1
          fi
