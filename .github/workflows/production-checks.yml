name: PR checks

# Both branches, not just production. PRs to main — Dependabot's, in particular
# — previously ran nothing at all: build-push.yml triggers on push, and this
# file only listened for production. Dependency bumps were landing on main
# unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm test

      # In the `test` job on purpose: `test` is a required status check on
      # production, so a vulnerable dependency blocks the merge. As its own
      # job it would be advisory and gate nothing.
      - run: npm audit --audit-level=high

      # Only on the way to production, because that is the merge that cuts a
      # release and so the moment the notes are read. Five releases running,
      # [Unreleased] was left holding the previous one's notes and published
      # them a second time; it is written down in two places and was missed
      # every time, which is the argument for checking it rather than asking.
      - name: Refuse notes that have already been published
        if: github.base_ref == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-changelog.sh

  e2e:
    # The release gate, in a browser, on GitHub's runners rather than in the
    # deploy: installing a browser on the in-cluster self-hosted runner
    # OOM-kills it.
    #
    # It tests the Docker image this commit builds, the same artifact the
    # deploy ships, with the test fixtures mounted where the cluster mounts the
    # real pictures (/data/assets), in four browsers: desktop Chrome, an
    # Android phone, an iPhone (WebKit, i.e. Safari) and desktop Firefox. Then
    # Lighthouse, Google's PageSpeed engine, on a phone profile, on the lobby
    # and on a room. One job, so the required check stays the single `e2e`
    # context. This is kube-setup's "public web pages" baseline
    # (docs/cluster-deployment-requirements.md, §4), adapted from
    # klaushofrichter/christina.art and www-skylar-technology.
    runs-on: ubuntu-latest
    # A stalled browser download once ran for GitHub's 6-hour default before
    # it was cancelled (www-skylar-technology #55), holding up the merge.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # On the host's network, so the browsers' requests reach the server
      # from loopback. The rate limiter (src/ratelimit.ts) exempts loopback;
      # through Docker's port mapping every request would arrive from the
      # bridge's 172.17.0.1, one address for four browsers and Lighthouse,
      # and the suite spends several times the 300 requests per five minutes
      # one visitor is allowed.
      - name: Build and start the image
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION=2099.01.01.1 -t art:e2e .
          docker run -d --name site --network host -e PORT=8080 -e ASSETS_DIR=/data/assets \
            -v "$PWD/test/fixtures/assets:/data/assets:ro" art:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && break
            echo "waiting for the image (${i}/30)"; sleep 1
          done
          curl -sf http://localhost:8080/health | tee /dev/stderr | grep -q '"version":"2099.01.01.1"' \
            || { echo "::error::the image did not come up with the stamped version"; docker logs site; exit 1; }

      # `--with-deps` runs `apt-get update`, which reads every source on the
      # runner image, including Google's Chrome repository, which this job
      # needs no packages from. One bad index fails the whole update and takes
      # the job with it: on 2026-09-09 a Hash Sum mismatch on dl.google.com
      # failed every e2e run for hours, and since e2e is a required check on
      # production, it blocked releases as well as PRs. So drop the source.
      # The Chrome binary itself stays: Lighthouse uses it below.
      - name: Install the browsers
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit firefox

      # failOnFlakyTests (playwright.config.ts) fails this step if any test
      # passed only on its retry.
      - name: Walk the site in four browsers
        env:
          BASE_URL: http://localhost:8080
          EXPECT_VERSION: 2099.01.01.1
        run: npx playwright test

      # The lobby, and a room opened from a shared link (fixture "Wide"),
      # which is the other first screen a visitor arrives on.
      - name: Lighthouse (Google PageSpeed) on a phone
        run: scripts/lighthouse-gate.sh http://localhost:8080/ 'http://localhost:8080/?id=fixwide1'

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report*.report.html
          retention-days: 14

      - name: Server log when something failed
        if: failure()
        run: docker logs site || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=0
          for f in sarif-results/*.sarif; do
            count=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + count))
            # Print what was found, not just how much. A bare count means
            # anyone hitting this gate has to re-run CodeQL locally to learn
            # anything, which is most of the cost of the gate.
            jq -r '.runs[] as $run | $run.results[]
              | . as $r
              | ($run.tool.driver.rules[$r.rule.index // 0].id // $r.ruleId) as $rule
              | ($r.locations[0].physicalLocation) as $loc
              | "\($loc.artifactLocation.uri):\($loc.region.startLine // 0)  [\($rule)]  \($r.message.text)"' "$f" || true
          done
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge"
            exit 1
          fi
